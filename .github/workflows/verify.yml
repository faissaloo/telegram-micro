name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run deterministic build and full tests
        env:
          TELEGRAM_MICRO_BOOTSTRAP_DIR: ${{ runner.temp }}/telegrammicro-bootstrap
          SQUIRRELJME_DIR: ${{ runner.temp }}/SquirrelJME
        run: ./scripts/verify.sh --full
